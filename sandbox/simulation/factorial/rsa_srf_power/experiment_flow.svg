<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <rect width="1100" height="1600" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="550" y="45" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#2C3E50">RSA vs SRF Power Comparison</text>

  <!-- ==================== PART 1: DATA GENERATION ==================== -->
  <rect x="30" y="70" width="1040" height="320" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2" rx="10"/>
  <text x="550" y="100" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#495057">Part 1: Data Generation</text>

  <!-- X matrix (signal) -->
  <rect x="60" y="125" width="220" height="170" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="170" y="150" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976D2">X (factorial design)</text>
  <text x="170" y="168" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">N × k  (e.g. 48 × 11)</text>

  <!-- Column labels -->
  <rect x="75" y="180" width="50" height="20" fill="#FFCDD2" rx="3"/>
  <text x="100" y="194" font-family="Arial" font-size="9" text-anchor="middle" fill="#C62828">anim</text>
  <rect x="130" y="180" width="50" height="20" fill="#C8E6C9" rx="3"/>
  <text x="155" y="194" font-family="Arial" font-size="9" text-anchor="middle" fill="#2E7D32">size</text>
  <rect x="185" y="180" width="50" height="20" fill="#BBDEFB" rx="3"/>
  <text x="210" y="194" font-family="Arial" font-size="9" text-anchor="middle" fill="#1565C0">shape</text>
  <rect x="240" y="180" width="25" height="20" fill="#E1BEE7" rx="3"/>
  <text x="252" y="194" font-family="Arial" font-size="8" text-anchor="middle" fill="#7B1FA2">...</text>

  <!-- Grid for X -->
  <rect x="75" y="205" width="190" height="70" fill="white" stroke="#90CAF9" stroke-width="1"/>
  <text x="170" y="225" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[1 0 | 1 0 0 | 1 0 | ...]</text>
  <text x="170" y="245" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[1 0 | 0 1 0 | 0 1 | ...]</text>
  <text x="170" y="265" font-family="Monaco" font-size="9" text-anchor="middle" fill="#888">...</text>

  <!-- Plus sign -->
  <text x="310" y="220" font-family="Arial" font-size="36" text-anchor="middle" fill="#555">+</text>

  <!-- Noise column -->
  <rect x="340" y="125" width="100" height="170" fill="#FFEBEE" stroke="#E74C3C" stroke-width="2" rx="5"/>
  <text x="390" y="150" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#C62828">noise</text>
  <text x="390" y="168" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">N × 1</text>
  <text x="390" y="188" font-family="Arial" font-size="9" text-anchor="middle" fill="#888">scaled for SNR</text>

  <rect x="355" y="205" width="70" height="70" fill="white" stroke="#FFCDD2" stroke-width="1"/>
  <text x="390" y="225" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">.3</text>
  <text x="390" y="245" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">.8</text>
  <text x="390" y="265" font-family="Monaco" font-size="10" text-anchor="middle" fill="#888">...</text>

  <!-- Equals sign -->
  <text x="475" y="220" font-family="Arial" font-size="36" text-anchor="middle" fill="#555">=</text>

  <!-- X_combined -->
  <rect x="510" y="125" width="180" height="170" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="5"/>
  <text x="600" y="150" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#7B1FA2">X_data</text>
  <text x="600" y="168" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">[X | noise]  N × (k+1)</text>

  <rect x="525" y="205" width="150" height="70" fill="white" stroke="#CE93D8" stroke-width="1"/>
  <rect x="525" y="205" width="120" height="70" fill="#E3F2FD" opacity="0.3"/>
  <rect x="645" y="205" width="30" height="70" fill="#FFEBEE" opacity="0.5"/>
  <text x="600" y="245" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">X columns | noise</text>

  <!-- Arrow to RSM -->
  <line x1="700" y1="210" x2="750" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="725" y="200" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">@ .T</text>

  <!-- RSM result -->
  <rect x="760" y="125" width="290" height="170" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="905" y="150" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">RSM = X_data @ X_data.T</text>

  <rect x="790" y="175" width="70" height="70" fill="white" stroke="#A5D6A7" stroke-width="2"/>
  <text x="825" y="215" font-family="Arial" font-size="20" text-anchor="middle" fill="#4CAF50">S</text>
  <text x="825" y="260" font-family="Arial" font-size="9" text-anchor="middle" fill="#2E7D32">X @ X.T</text>

  <text x="880" y="215" font-family="Arial" font-size="24" text-anchor="middle" fill="#555">+</text>

  <rect x="910" y="175" width="70" height="70" fill="white" stroke="#FFCDD2" stroke-width="2"/>
  <text x="945" y="215" font-family="Arial" font-size="20" text-anchor="middle" fill="#E74C3C">E</text>
  <text x="945" y="260" font-family="Arial" font-size="9" text-anchor="middle" fill="#C62828">n @ n.T</text>

  <text x="905" y="280" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">Signal preserved + noise added</text>

  <!-- CAVEAT BOX -->
  <rect x="60" y="310" width="990" height="60" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="80" y="335" font-family="Arial" font-size="12" font-weight="bold" fill="#E65100">⚠ Key Issue:</text>
  <text x="200" y="335" font-family="Arial" font-size="12" fill="#555">RSM = S + E means signal S is perfectly preserved. Noise E adds variance but doesn't corrupt S.</text>
  <text x="80" y="355" font-family="Arial" font-size="11" fill="#888">Both RSA and SRF may detect signal easily → may not show SRF advantage with this noise model.</text>

  <!-- ==================== PART 2: RSA TEST ==================== -->
  <rect x="30" y="400" width="510" height="300" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" rx="10"/>
  <text x="285" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#F57F17">RSA: Test Each Factor Separately</text>

  <!-- Factor hypothesis boxes -->
  <text x="60" y="460" font-family="Arial" font-size="12" font-weight="bold" fill="#555">For each factor f ∈ {animacy, size, shape, color}:</text>

  <!-- H_f box -->
  <rect x="60" y="480" width="180" height="90" fill="white" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="150" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976D2">Hypothesis H_f</text>
  <text x="150" y="525" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">X_f = columns for factor f</text>
  <text x="150" y="545" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">H_f = X_f @ X_f.T</text>
  <text x="150" y="565" font-family="Arial" font-size="9" text-anchor="middle" fill="#888">(e.g. just animacy cols)</text>

  <!-- corr -->
  <text x="265" y="530" font-family="Arial" font-size="16" text-anchor="middle" fill="#555">corr</text>

  <!-- RSM box -->
  <rect x="295" y="480" width="100" height="90" fill="white" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="345" y="505" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">RSM</text>
  <text x="345" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="#4CAF50">S + E</text>
  <text x="345" y="555" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">measured</text>

  <!-- Result -->
  <text x="420" y="530" font-family="Arial" font-size="16" text-anchor="middle" fill="#555">=</text>
  <text x="480" y="530" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">r_f</text>

  <!-- Permutation box -->
  <rect x="60" y="590" width="460" height="90" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1" rx="5"/>
  <text x="290" y="615" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Restricted Permutation Null</text>
  <text x="80" y="640" font-family="Arial" font-size="10" fill="#555">• Strata = levels of OTHER factors (not f)</text>
  <text x="80" y="658" font-family="Arial" font-size="10" fill="#555">• Only shuffle items within same strata</text>
  <text x="80" y="676" font-family="Arial" font-size="10" fill="#555">• p_f = (# null ≥ r_f + 1) / (n_perm + 1)</text>

  <!-- ==================== PART 3: SRF TEST ==================== -->
  <rect x="560" y="400" width="510" height="300" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="10"/>
  <text x="815" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2E7D32">SRF: LOO Matching Test</text>

  <!-- SRF factorization -->
  <rect x="590" y="460" width="150" height="80" fill="white" stroke="#9C27B0" stroke-width="2" rx="5"/>
  <text x="665" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#7B1FA2">1. Fit SRF(rank=k)</text>
  <text x="665" y="505" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">RSM → W</text>
  <text x="665" y="525" font-family="Arial" font-size="9" text-anchor="middle" fill="#888">W is N × k embedding</text>

  <!-- LOO box -->
  <rect x="760" y="460" width="290" height="80" fill="white" stroke="#00BCD4" stroke-width="2" rx="5"/>
  <text x="905" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#00838F">2. LOO for each item i</text>
  <text x="780" y="505" font-family="Arial" font-size="9" fill="#555">• Hungarian match W[~i] → X[~i]</text>
  <text x="780" y="520" font-family="Arial" font-size="9" fill="#555">• Apply permutation to W[i]</text>
  <text x="780" y="535" font-family="Arial" font-size="9" fill="#555">• Predict each factor: argmax</text>

  <!-- Accuracy box -->
  <rect x="590" y="555" width="200" height="60" fill="white" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="690" y="578" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">3. Compute Accuracy</text>
  <text x="690" y="598" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">acc = correct / (N × n_factors)</text>

  <!-- Null box -->
  <rect x="810" y="555" width="240" height="60" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1" rx="5"/>
  <text x="930" y="578" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">4. Permutation Null</text>
  <text x="930" y="598" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Shuffle X rows (restricted), recompute</text>

  <!-- P-value -->
  <rect x="590" y="630" width="460" height="50" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="820" y="660" font-family="Arial" font-size="12" text-anchor="middle" fill="#2E7D32">p_srf = (# null ≥ acc + 1) / (n_perm + 1)</text>

  <!-- ==================== PART 4: LOO VISUAL ==================== -->
  <rect x="30" y="720" width="1040" height="380" fill="white" stroke="#DEE2E6" stroke-width="2" rx="10"/>
  <text x="550" y="750" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">LOO Detail: Hold out item i=2</text>

  <!-- W matrix -->
  <rect x="60" y="780" width="160" height="150" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="5"/>
  <text x="140" y="805" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#7B1FA2">W (embedding)</text>

  <text x="140" y="830" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 0: [.1 .8 .2 .0 .1]</text>
  <text x="140" y="848" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 1: [.7 .9 .0 .1 .3]</text>
  <rect x="65" y="855" width="150" height="16" fill="#FFCDD2" opacity="0.5"/>
  <text x="140" y="866" font-family="Monaco" font-size="9" text-anchor="middle" fill="#C62828">item 2: [.0 .9 .1 .1 .9]</text>
  <text x="140" y="884" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 3: [.9 .1 .2 .0 .0]</text>
  <text x="140" y="902" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 4: [.6 .0 .1 .0 .4]</text>
  <text x="140" y="920" font-family="Monaco" font-size="9" text-anchor="middle" fill="#888">...</text>

  <!-- X matrix -->
  <rect x="250" y="780" width="160" height="150" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="330" y="805" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1976D2">X (design)</text>

  <text x="330" y="830" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 0: [1 0 | 1 0 0]</text>
  <text x="330" y="848" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 1: [1 0 | 0 1 0]</text>
  <rect x="255" y="855" width="150" height="16" fill="#FFCDD2" opacity="0.5"/>
  <text x="330" y="866" font-family="Monaco" font-size="9" text-anchor="middle" fill="#C62828">item 2: [1 0 | 0 0 1]</text>
  <text x="330" y="884" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 3: [0 1 | 1 0 0]</text>
  <text x="330" y="902" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">item 4: [0 1 | 0 1 0]</text>
  <text x="330" y="920" font-family="Monaco" font-size="9" text-anchor="middle" fill="#888">...</text>

  <!-- Hungarian matching -->
  <rect x="440" y="780" width="200" height="100" fill="#E0F7FA" stroke="#00BCD4" stroke-width="2" rx="5"/>
  <text x="540" y="805" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#00838F">Hungarian Match</text>
  <text x="540" y="825" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">W[0,1,3,4,...] ↔ X[0,1,3,4,...]</text>
  <text x="540" y="845" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">(exclude item 2)</text>

  <text x="460" y="870" font-family="Monaco" font-size="9" fill="#333">perm = [1, 3, 0, 2, 4]</text>

  <!-- Arrow -->
  <line x1="540" y1="890" x2="540" y2="930" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Apply to held out -->
  <rect x="440" y="940" width="200" height="70" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="540" y="965" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">Apply to item 2</text>
  <text x="540" y="985" font-family="Monaco" font-size="9" text-anchor="middle" fill="#555">W[2] = [.0 .9 .1 .1 .9]</text>
  <text x="540" y="1002" font-family="Monaco" font-size="9" text-anchor="middle" fill="#E65100">W_aligned = [.9 .1 | .0 .1 .9]</text>

  <!-- Prediction -->
  <rect x="680" y="780" width="180" height="120" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="770" y="805" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">Predict item 2</text>

  <text x="700" y="830" font-family="Arial" font-size="10" fill="#555">W_aligned:</text>
  <rect x="700" y="840" width="45" height="22" fill="#FFEBEE" stroke="#E74C3C" stroke-width="1"/>
  <text x="722" y="856" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">.9 .1</text>
  <rect x="750" y="840" width="65" height="22" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="782" y="856" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">.0 .1 .9</text>

  <text x="700" y="880" font-family="Arial" font-size="10" fill="#C62828">anim: argmax=0 ✓</text>
  <text x="700" y="895" font-family="Arial" font-size="10" fill="#2E7D32">size: argmax=2 ✓</text>

  <!-- True label -->
  <rect x="680" y="910" width="180" height="50" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="770" y="932" font-family="Arial" font-size="10" text-anchor="middle" fill="#2E7D32">X[2] = [1 0 | 0 0 1]</text>
  <text x="770" y="950" font-family="Arial" font-size="11" text-anchor="middle" fill="#2E7D32">= animate, large ✓</text>

  <!-- Repeat note -->
  <rect x="890" y="780" width="160" height="90" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1" rx="5"/>
  <text x="970" y="805" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#546E7A">Repeat all N</text>
  <text x="970" y="830" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Sum correct</text>
  <text x="970" y="850" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">across items</text>
  <text x="970" y="870" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">× factors</text>

  <!-- ==================== PART 5: COMPARISON ==================== -->
  <rect x="30" y="1120" width="1040" height="180" fill="#FAFAFA" stroke="#DEE2E6" stroke-width="2" rx="10"/>
  <text x="550" y="1150" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">Comparison</text>

  <rect x="60" y="1170" width="300" height="110" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" rx="5"/>
  <text x="210" y="1195" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#F57F17">RSA</text>
  <text x="210" y="1220" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">Test each factor's H_f against RSM</text>
  <text x="210" y="1240" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">Restricted permutation (by strata)</text>
  <text x="210" y="1265" font-family="Arial" font-size="10" text-anchor="middle" fill="#888">Question: Is factor f in RSM?</text>

  <rect x="400" y="1170" width="300" height="110" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="550" y="1195" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#2E7D32">SRF (LOO)</text>
  <text x="550" y="1220" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">Factorize RSM, predict factors via</text>
  <text x="550" y="1240" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">Hungarian matching + argmax</text>
  <text x="550" y="1265" font-family="Arial" font-size="10" text-anchor="middle" fill="#888">Question: Can we decode factors?</text>

  <rect x="740" y="1170" width="310" height="110" fill="#FFEBEE" stroke="#E74C3C" stroke-width="2" rx="5"/>
  <text x="895" y="1195" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#C62828">Open Question</text>
  <text x="895" y="1220" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">With RSM = S + E (additive noise),</text>
  <text x="895" y="1240" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">signal S is intact in RSM.</text>
  <text x="895" y="1265" font-family="Arial" font-size="10" text-anchor="middle" fill="#888">Does SRF have higher power than RSA?</text>

</svg>
