# @package _global_
experiment_name: "ppi"
task: ???

# --- Shared Parameters ---
n_jobs: -1
seed: 0
rank: 50
methods: ["srf", "skipgnn"]

data_dir: "${paths.data_dir}/ppi"


seal:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  num_hops: 1
  hidden_channels: 32
  num_layers: 3
  k: 0.6

skipgnn:
  epochs: 50
  batch_size: 128
  lr: 0.01
  hidden1: 64
  hidden2: 32
  hidden_decode1: 16
  dropout: 0.5

link_prediction:
  # dataset: "c_elegans"
  dataset: "string"
  splits_dir: "${data_dir}/splits"
  n_folds: 10
  neg_ratio: 1
  embedding_dim: 128
  embedding_epochs: 10

corum_validation:
  string_data: null

node_classification:
  n_runs: 5
  test_ratio: 0.2

plot_link_prediction:
  results_dir: "${project_root}/experiments/ppi/outputs/link_prediction/c_elegans"