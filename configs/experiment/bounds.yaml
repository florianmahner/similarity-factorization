# @package _global_
defaults:
  - override /dataset: null

experiment_name: "bounds"
task: ???

hydra:
  job:
    chdir: true
  run:
    dir: experiments/${experiment_name}/outputs/
  sweep:
    dir: experiments/${experiment_name}/outputs/
    subdir: ${hydra.job.override_dirname}

slurm:
  partition: cpu
  time: 5  # minutes
  mem: 16G
  cpus_per_task: 1
  gpus_per_node: 0

common:
  n_jobs: -1
  random_state: 0

estimate:
  subject_id: null

