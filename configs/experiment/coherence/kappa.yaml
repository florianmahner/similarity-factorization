# Kappa changepoint rank estimation across datasets
#
# Estimates dimensionality (k*) via kappa changepoint on eigenspace coherence.
#
# Usage:
#   ./scripts/submit experiments/coherence/kappa.py --bg

defaults:
  - /base
  - _self_

experiment_name: coherence
task: kappa

coherence:
  B: 50
  B_null: 30
  n_p: 25
  p_min: 0.05
  p_max: 0.95
  alpha_tau: 0.95
  ci_level: 0.95
  random_state: 42

datasets:
  # --- Small datasets (seconds) ---
  - name: mur92
    config: mur92
    k_max: 80
    k_step: 1
  - name: peterson_animals
    config: peterson_animals
    k_max: 100
    k_step: 1
  - name: peterson_various
    config: peterson_various
    k_max: 100
    k_step: 1

  # --- THINGS behavioral triplets (1854x1854, minutes each) ---
  # Uses same splits as experiments/things_behavior/lowdata_comparison
  - name: things_5pct
    config: things_behavior
    triplet_pct: 5
    triplet_partition: 0
    k_max: 120
    k_step: 5
  - name: things_10pct
    config: things_behavior
    triplet_pct: 10
    triplet_partition: 0
    k_max: 120
    k_step: 5
  - name: things_20pct
    config: things_behavior
    triplet_pct: 20
    triplet_partition: 0
    k_max: 120
    k_step: 5
  - name: things_50pct
    config: things_behavior
    triplet_pct: 50
    triplet_partition: 0
    k_max: 120
    k_step: 5
  - name: things_100pct
    config: things_behavior
    triplet_pct: 100
    k_max: 120
    k_step: 5

  # --- Medium datasets (minutes) ---
  - name: dinov3
    config: dinov3
    k_max: 200
    k_step: 5

  # --- Large datasets (30-45 min each) ---
  - name: swow
    config: swow
    k_max: 200
    k_step: 5
  - name: nsd_subj01
    config: nsd
    subject_id: 1
    k_max: 200
    k_step: 5
  - name: nsd_subj02
    config: nsd
    subject_id: 2
    k_max: 200
    k_step: 5

  # Commented out: ~3h runtime for coherence alone
  # - name: things_monkey_22k
  #   config: things_monkey_22k_f
  #   k_max: 200
  #   k_step: 5
