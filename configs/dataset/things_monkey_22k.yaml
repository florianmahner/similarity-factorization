# @package dataset
# THINGS Monkey IT Neural Data (22k images)

name: things-monkey-22k
type: neural_features
path: ${paths.ssd}/datasets/things/macaque

# Similarity computation
similarity_fn: gaussian_kernel
similarity_kwargs:
  sigma_scale: 0.4  # following Mahner et al. 2026 (deep-similarity) — selected via H(stability, R²) sweep

# Loading parameters
loader_kwargs:
  monkey_type: "F"
  roi: "it"
  min_reliab: 0.3

# Cross-experiment references
bounds_task: things-monkey-22k
rank_range: [5, 50, 5]
