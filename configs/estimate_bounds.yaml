# Bounds Estimation
#
# Estimate sampling bounds for any dataset.
#
# Usage:
#   ./scripts/submit experiments/estimate_bounds.py dataset=swow
#   ./scripts/submit experiments/estimate_bounds.py dataset=nsd subject_id=1
#   ./scripts/submit experiments/estimate_bounds.py dataset=things_behavior
#   ./scripts/submit experiments/estimate_bounds.py dataset=things_macaque

defaults:
  - /base
  - /dataset: ???  # Required: swow, nsd, things_behavior, mur92, cichy118, peterson, ...
  - _self_

experiment_name: bounds
task: ${dataset.bounds_task}  # Output to bounds/<dataset_bounds_task>/

# For multi-subject datasets (e.g., NSD)
subject_id: null

common:
  n_jobs: 1
  random_state: 42
