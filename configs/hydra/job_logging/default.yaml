# @package hydra.job_logging
# Production logging: writes to daily log file in logs/
version: 1
formatters:
  detailed:
    format: "[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: detailed
    stream: ext://sys.stdout

  daily_file:
    class: src.utils.log_handler.DirectoryFileHandler
    formatter: detailed
    # Logs to logs/YYMMDD/HHMMSS_experiment_task.log
    filename: ${hydra:runtime.cwd}/logs/${now:%y%m%d}/${now:%H%M%S}_${experiment_name}_${task}.log
    mode: w  # New file per run

root:
  handlers: [console, daily_file]
  level: INFO

disable_existing_loggers: false
