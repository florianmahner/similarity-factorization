# @package hydra.job_logging
# All logging goes to .status/log in the output directory.
# Uses custom handler that creates .status/ directory if needed.
version: 1

formatters:
  detailed:
    format: "[%(asctime)s][%(name)s][%(levelname)s] - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: detailed
    stream: ext://sys.stdout

  file:
    class: src.utils.logging.StatusFileHandler
    formatter: detailed
    filename: .status/log
    mode: a

root:
  handlers: [console, file]
  level: INFO

disable_existing_loggers: false
