# @package hydra.launcher
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
# Use experiment-specific slurm settings if available, otherwise defaults
partition: ${slurm.partition}
timeout_min: ${slurm.time}
cpus_per_task: ${slurm.cpus_per_task}
gpus_per_node: ${slurm.gpus_per_node}
mem: ${slurm.mem}
nodes: 1
tasks_per_node: 1
name: ${experiment_name}
comment: "Running ${experiment_name}"
setup:
  - export PYTHONUNBUFFERED=1
  - export PATH=/raven/u/fmahner/similarity-factorization/.venv/bin:$PATH