defaults:
  - _self_
  - paths
  - hydra/dataset: null
  - hydra/experiment@_global_: default
  - override hydra/launcher: joblib

experiment_name: "default"

hydra:
  output_subdir: .hydra
  job:
    chdir: true
  run:
    dir: ${paths.output_dir}/${now:%y%m%d}/${now:%H%M%S}
  sweep:
    dir: ${paths.output_dir}/multirun/${now:%y%m%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}

  callbacks:
    merge_results:
      _target_: utils.callbacks.MergeResultsCallback
