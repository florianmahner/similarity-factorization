# Base Configuration
defaults:
  - _self_
  - paths: local

# Identifiers (overridden by task configs)
experiment_name: ???
task: ???

# Global Defaults
seed: 42
n_jobs: -1

# Project Root
project_root: /LOCAL/fmahner/similarity-factorization

# Hydra Configuration
hydra:
  job:
    chdir: true
    name: log
  run:
    dir: ${project_root}/outputs/experiments/${experiment_name}/${task}
  sweep:
    dir: ${project_root}/outputs/experiments/${experiment_name}/${task}
    subdir: ${hydra.job.override_dirname}
  job_logging:
    handlers:
      file:
        class: src.utils.logging.StatusFileHandler
        filename: .status/log
