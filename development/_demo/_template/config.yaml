# Development experiment config template
# Copy this folder to start a new development experiment

defaults:
  - _self_
  - override hydra/launcher: joblib  # or submitit_slurm for cluster

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${now:%y%m%d}/${now:%H%M%S}
  sweep:
    dir: outputs/${now:%y%m%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    # Joblib settings (local parallel)
    n_jobs: -1
    # For SLURM, uncomment below and comment joblib:
    # partition: gpu
    # time: 60
    # mem_gb: 16
    # cpus_per_task: 4

# Experiment parameters
seed: 42
n_jobs: -1

# Add your parameters below:
# param1: value1
# param2: value2
