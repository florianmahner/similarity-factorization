# @package _global_
# Development Experiment Config Template
# Copy this folder to start a new development experiment

defaults:
  - _self_
  - override hydra/launcher: local  # Options: local, default (joblib), slurm
  - override hydra/job_logging: dev

# Experiment metadata (CUSTOMIZE THESE)
experiment_name: my_experiment_dev
task: development

# Common parameters
seed: 42
n_jobs: -1

# Add your experiment-specific parameters below
# Example:
# param1: value1
# param2: value2

# SLURM configuration (for cluster submission)
slurm:
  partition: interactive  # Use 'interactive' for fast debug runs (<2h), 'cpu' for longer jobs
  time: 30  # minutes
  mem: 16G
  cpus_per_task: 4
  gpus_per_node: 0

# Hydra configuration (timestamped outputs)
hydra:
  job:
    chdir: true
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
