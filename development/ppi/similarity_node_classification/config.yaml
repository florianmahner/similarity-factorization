defaults:
  - /base
  - _self_

# Data directory for PPI data
data_dir: ${project_root}/data/ppi

# Dataset: ppi, blogcatalog, wikipedia
dataset: wikipedia

# Methods to compare
# SRF transforms: binary, CN, AA, RA
# Graph methods: deepwalk, node2vec, line
methods:
  - binary
  - CN
  - AA
  - deepwalk
  - node2vec
  - line

# Network size (optional, for subsampling large graphs)
size: 500

# Embedding rank
rank: 64

# Training ratios to evaluate (following NetMF paper)
train_ratios:
  - 0.1
  - 0.5
  - 0.9

seed: 42
n_jobs: 4
