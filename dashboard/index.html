<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HydraFlow Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              vscode: {
                bg: 'var(--vscode-bg)',
                sidebar: 'var(--vscode-sidebar)',
                activity: 'var(--vscode-activity)',
                item: 'var(--vscode-item)',
                hover: 'var(--vscode-hover)',
                text: 'var(--vscode-text)',
                header: 'var(--vscode-header)',
                accent: '#007acc',
                blue: '#4fc1ff',
                green: '#6a9955',
                red: '#f14c4c',
                orange: '#cca700',
              }
            },
            fontFamily: {
              mono: ['Menlo', 'Monaco', 'Courier New', 'monospace'],
              sans: ['Segoe UI', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Mode Defaults (VS Code Light) */
        --vscode-bg: #ffffff;
        --vscode-sidebar: #f3f3f3;
        --vscode-activity: #e5e5e5;
        --vscode-item: #f8f8f8;
        --vscode-hover: #e8e8e8;
        --vscode-text: #616161;
        --vscode-header: #24292f;
      }

      :root.dark {
        /* Dark Mode Defaults (VS Code Dark) */
        --vscode-bg: #1e1e1e;
        --vscode-sidebar: #252526;
        --vscode-activity: #333333;
        --vscode-item: #37373d;
        --vscode-hover: #2a2d2e;
        --vscode-text: #cccccc;
        --vscode-header: #ffffff;
      }

      body {
        background-color: var(--vscode-bg);
        color: var(--vscode-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden; /* App handles scrolling */
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom scrollbar for VS Code feel */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #888; 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
