# PPI Node Classification

defaults:
  - /base
  - _self_

experiment_name: ppi
task: node_classification

# === Sweep ===
# dataset: [c_elegans, huri, string]
dataset: string

# === Parameters ===
seed: 0
rank: 50
n_runs: 5
test_ratio: 0.2
methods: [srf, deepwalk, line, node2vec]

# === Compute ===
n_jobs: 16

# === Paths ===
data_dir: ${paths.data_dir}/ppi
