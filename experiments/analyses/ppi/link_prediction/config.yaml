# PPI Link Prediction

defaults:
  - /base
  - _self_

experiment_name: ppi
task: link_prediction

# === Sweep (lists = parallel runs) ===
dataset: [c_elegans, huri, string]
# dataset: string  # Single run

# === Parameters ===
seed: 0
rank: 50
n_folds: 10
methods: [srf, skipgnn, cn, aa, jc, ra]

# === Model Settings ===
skipgnn:
  epochs: 50
  batch_size: 128
  lr: 0.01
  hidden1: 64
  hidden2: 32
  hidden_decode1: 16
  dropout: 0.5

# === Compute ===
n_jobs: 16
sweep_jobs: 3

# === Paths ===
data_dir: ${paths.data_dir}/ppi
