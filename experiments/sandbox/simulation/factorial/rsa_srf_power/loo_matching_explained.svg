<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1400" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">LOO Matching Test Explained</text>
  <text x="500" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#7F8C8D">Simple Example: 6 items, 2 factors (animacy × size)</text>

  <!-- ==================== SECTION 1: THE DATA ==================== -->
  <text x="50" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50">1. Our Data</text>

  <!-- X matrix -->
  <text x="80" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#4A90D9">X (Design Matrix)</text>
  <text x="80" y="165" font-family="Arial" font-size="11" fill="#7F8C8D">One-hot encoded factors</text>

  <!-- Column headers for X -->
  <text x="200" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#E74C3C">anim</text>
  <text x="240" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#E74C3C">inan</text>
  <text x="290" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#27AE60">sm</text>
  <text x="320" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#27AE60">md</text>
  <text x="350" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#27AE60">lg</text>

  <!-- X matrix content -->
  <rect x="175" y="205" width="200" height="150" fill="white" stroke="#DDD" stroke-width="1"/>

  <!-- Row labels and data -->
  <text x="165" y="225" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 0:</text>
  <text x="270" y="225" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[1, 0,  1, 0, 0]</text>
  <text x="390" y="225" font-family="Arial" font-size="10" fill="#888">animate, small</text>

  <text x="165" y="250" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 1:</text>
  <text x="270" y="250" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[1, 0,  0, 1, 0]</text>
  <text x="390" y="250" font-family="Arial" font-size="10" fill="#888">animate, medium</text>

  <text x="165" y="275" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 2:</text>
  <text x="270" y="275" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[1, 0,  0, 0, 1]</text>
  <text x="390" y="275" font-family="Arial" font-size="10" fill="#888">animate, large</text>

  <text x="165" y="300" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 3:</text>
  <text x="270" y="300" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[0, 1,  1, 0, 0]</text>
  <text x="390" y="300" font-family="Arial" font-size="10" fill="#888">inanimate, small</text>

  <text x="165" y="325" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 4:</text>
  <text x="270" y="325" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[0, 1,  0, 1, 0]</text>
  <text x="390" y="325" font-family="Arial" font-size="10" fill="#888">inanimate, medium</text>

  <text x="165" y="350" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 5:</text>
  <text x="270" y="350" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[0, 1,  0, 0, 1]</text>
  <text x="390" y="350" font-family="Arial" font-size="10" fill="#888">inanimate, large</text>

  <!-- W matrix -->
  <text x="550" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#9B59B6">W (SRF Embedding)</text>
  <text x="550" y="165" font-family="Arial" font-size="11" fill="#7F8C8D">Columns in UNKNOWN order!</text>

  <!-- Column headers for W -->
  <text x="665" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#9B59B6">c0</text>
  <text x="700" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#9B59B6">c1</text>
  <text x="735" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#9B59B6">c2</text>
  <text x="770" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#9B59B6">c3</text>
  <text x="805" y="195" font-family="Monaco" font-size="10" text-anchor="middle" fill="#9B59B6">c4</text>

  <!-- W matrix content -->
  <rect x="640" y="205" width="190" height="150" fill="white" stroke="#DDD" stroke-width="1"/>

  <text x="630" y="225" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 0:</text>
  <text x="735" y="225" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.latexinline[1], .8, .latexinline[2], .0, .1]</text>

  <text x="630" y="250" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 1:</text>
  <text x="735" y="250" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.latexinline[7], .9, .0, .1, .latexinline[3]]</text>

  <text x="630" y="275" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 2:</text>
  <text x="735" y="275" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.0, .9, .1, .1, .latexinline[9]]</text>

  <text x="630" y="300" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 3:</text>
  <text x="735" y="300" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.latexinline[9], .1, .latexinline[2], .0, .0]</text>

  <text x="630" y="325" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 4:</text>
  <text x="735" y="325" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.latexinline[6], .0, .1, .0, .latexinline[4]]</text>

  <text x="630" y="350" font-family="Monaco" font-size="11" text-anchor="end" fill="#555">item 5:</text>
  <text x="735" y="350" font-family="Monaco" font-size="11" text-anchor="middle" fill="#333">[.1, .1, .0, .1, .latexinline[8]]</text>

  <text x="735" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#E74C3C">Which W column = which factor?</text>

  <!-- ==================== SECTION 2: LOO - HOLD OUT ITEM 2 ==================== -->
  <rect x="30" y="410" width="940" height="320" fill="#FFF9E6" stroke="#F0E68C" stroke-width="2" rx="10"/>
  <text x="50" y="440" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50">2. LOO: Hold out item 2</text>
  <text x="50" y="465" font-family="Arial" font-size="12" fill="#7F8C8D">We want to predict: Is item 2 animate or inanimate? Small, medium, or large?</text>

  <!-- Training data -->
  <text x="80" y="505" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60">Training: items 0,1,3,4,5</text>

  <!-- X_train mini -->
  <rect x="80" y="520" width="150" height="90" fill="white" stroke="#27AE60" stroke-width="2" rx="5"/>
  <text x="155" y="540" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#27AE60">X_train</text>
  <text x="155" y="560" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[1,0, 1,0,0]</text>
  <text x="155" y="575" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[1,0, 0,1,0]</text>
  <text x="155" y="590" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[0,1, 1,0,0]</text>
  <text x="155" y="605" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">...</text>

  <!-- W_train mini -->
  <rect x="260" y="520" width="150" height="90" fill="white" stroke="#9B59B6" stroke-width="2" rx="5"/>
  <text x="335" y="540" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#9B59B6">W_train</text>
  <text x="335" y="560" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[.1,.8,.2,.0,.1]</text>
  <text x="335" y="575" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[.7,.9,.0,.1,.3]</text>
  <text x="335" y="590" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">[.9,.1,.2,.0,.0]</text>
  <text x="335" y="605" font-family="Monaco" font-size="9" text-anchor="middle" fill="#333">...</text>

  <!-- Arrow to Hungarian -->
  <line x1="420" y1="565" x2="480" y2="565" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hungarian matching box -->
  <rect x="490" y="505" width="200" height="120" fill="#E8F6F3" stroke="#1ABC9C" stroke-width="2" rx="5"/>
  <text x="590" y="530" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#1ABC9C">Hungarian Matching</text>
  <text x="590" y="555" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Find best column alignment</text>
  <text x="590" y="580" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">W_c0 → X_c2 (small)</text>
  <text x="590" y="595" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">W_c1 → X_c0 (anim)</text>
  <text x="590" y="610" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">W_c4 → X_c4 (large)</text>

  <!-- Arrow to mapping -->
  <line x1="700" y1="565" x2="760" y2="565" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Mapping result -->
  <rect x="770" y="505" width="180" height="120" fill="white" stroke="#E67E22" stroke-width="2" rx="5"/>
  <text x="860" y="530" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#E67E22">Column Mapping</text>
  <text x="860" y="560" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">perm = [1, 3, 0, 2, 4]</text>
  <text x="860" y="590" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">W[:, perm] aligns</text>
  <text x="860" y="605" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">with X columns</text>

  <!-- Held out item -->
  <text x="80" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C">Held out: item 2</text>

  <rect x="80" y="675" width="120" height="40" fill="white" stroke="#E74C3C" stroke-width="2" rx="5"/>
  <text x="140" y="700" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">W[2] = [.0,.9,.1,.1,.9]</text>

  <!-- Arrow -->
  <line x1="210" y1="695" x2="280" y2="695" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="685" font-family="Arial" font-size="9" text-anchor="middle" fill="#555">apply perm</text>

  <rect x="290" y="675" width="150" height="40" fill="white" stroke="#27AE60" stroke-width="2" rx="5"/>
  <text x="365" y="700" font-family="Monaco" font-size="10" text-anchor="middle" fill="#333">W_aligned = [.9,.1,.0,.1,.9]</text>

  <!-- ==================== SECTION 3: PREDICTION ==================== -->
  <rect x="30" y="750" width="940" height="280" fill="#F0F4FF" stroke="#A0C4FF" stroke-width="2" rx="10"/>
  <text x="50" y="780" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50">3. Predict Factor Labels for Item 2</text>

  <!-- Aligned embedding -->
  <text x="80" y="820" font-family="Arial" font-size="12" fill="#555">W_aligned[2] after reordering:</text>

  <rect x="80" y="835" width="400" height="60" fill="white" stroke="#333" stroke-width="1" rx="5"/>

  <!-- Animacy columns -->
  <rect x="85" y="840" width="80" height="50" fill="#FFEBEE" stroke="#E74C3C" stroke-width="1"/>
  <text x="125" y="860" font-family="Arial" font-size="10" text-anchor="middle" fill="#E74C3C">animacy</text>
  <text x="105" y="880" font-family="Monaco" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">.9</text>
  <text x="145" y="880" font-family="Monaco" font-size="12" text-anchor="middle" fill="#333">.1</text>

  <!-- Size columns -->
  <rect x="170" y="840" width="120" height="50" fill="#E8F5E9" stroke="#27AE60" stroke-width="1"/>
  <text x="230" y="860" font-family="Arial" font-size="10" text-anchor="middle" fill="#27AE60">size</text>
  <text x="195" y="880" font-family="Monaco" font-size="12" text-anchor="middle" fill="#333">.0</text>
  <text x="230" y="880" font-family="Monaco" font-size="12" text-anchor="middle" fill="#333">.1</text>
  <text x="265" y="880" font-family="Monaco" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">.9</text>

  <!-- Predictions -->
  <text x="520" y="850" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50">Predictions:</text>

  <text x="520" y="875" font-family="Arial" font-size="12" fill="#E74C3C">animacy: argmax([.9, .1]) = 0 → animate</text>
  <text x="520" y="895" font-family="Arial" font-size="12" fill="#27AE60">size: argmax([.0, .1, .9]) = 2 → large</text>

  <!-- True labels -->
  <text x="520" y="930" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50">True labels (from X[2]):</text>
  <text x="520" y="955" font-family="Arial" font-size="12" fill="#555">X[2] = [1,0, 0,0,1] → animate, large</text>

  <!-- Check -->
  <rect x="520" y="975" width="300" height="40" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="5"/>
  <text x="670" y="1000" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#27AE60">✓ Both correct! Score: 2/2</text>

  <!-- ==================== SECTION 4: FULL LOO ==================== -->
  <text x="50" y="1080" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50">4. Repeat for ALL Items</text>

  <rect x="80" y="1100" width="840" height="120" fill="white" stroke="#DDD" stroke-width="1" rx="5"/>

  <text x="100" y="1130" font-family="Monaco" font-size="11" fill="#555">Hold out item 0: predict from items 1,2,3,4,5 → correct: 2/2</text>
  <text x="100" y="1150" font-family="Monaco" font-size="11" fill="#555">Hold out item 1: predict from items 0,2,3,4,5 → correct: 2/2</text>
  <text x="100" y="1170" font-family="Monaco" font-size="11" fill="#555">Hold out item 2: predict from items 0,1,3,4,5 → correct: 2/2</text>
  <text x="100" y="1190" font-family="Monaco" font-size="11" fill="#555">... (repeat for all 6 items)</text>

  <rect x="600" y="1115" width="280" height="80" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="5"/>
  <text x="740" y="1145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498DB">Total Accuracy</text>
  <text x="740" y="1175" font-family="Monaco" font-size="16" text-anchor="middle" fill="#2C3E50">acc = 12/12 = 100%</text>

  <!-- ==================== SECTION 5: NULL DISTRIBUTION ==================== -->
  <text x="50" y="1270" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50">5. Permutation Null</text>

  <text x="80" y="1300" font-family="Arial" font-size="12" fill="#555">Shuffle X rows → break factor-item correspondence → recompute accuracy</text>
  <text x="80" y="1325" font-family="Arial" font-size="12" fill="#555">Repeat 500 times → null distribution → p-value = (# null ≥ obs + 1) / (n + 1)</text>

  <rect x="80" y="1345" width="200" height="35" fill="#FADBD8" stroke="#E74C3C" stroke-width="1" rx="5"/>
  <text x="180" y="1368" font-family="Arial" font-size="12" text-anchor="middle" fill="#C0392B">If p &lt; 0.05 → significant!</text>

</svg>
