<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="noiseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rsmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rsaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E67E22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="srfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E8449;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">RSA vs SRF Power Comparison</text>
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">Experimental Flow Diagram</text>

  <!-- STEP 1: Factorial Design -->
  <rect x="50" y="90" width="380" height="120" rx="10" fill="url(#signalGrad)" opacity="0.9"/>
  <text x="240" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 1: Factorial Design (Signal)</text>

  <rect x="70" y="125" width="340" height="70" rx="5" fill="white" opacity="0.95"/>
  <text x="240" y="148" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">X = one-hot encoded design matrix</text>
  <text x="240" y="168" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">N = 48 items, k = 11 dimensions</text>
  <text x="240" y="188" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#7F8C8D">(animacy:2, size:3, shape:2, color:4)</text>

  <!-- STEP 2: Noise Column -->
  <rect x="470" y="90" width="380" height="120" rx="10" fill="url(#noiseGrad)" opacity="0.9"/>
  <text x="660" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 2: Noise Column</text>

  <rect x="490" y="125" width="340" height="70" rx="5" fill="white" opacity="0.95"/>
  <text x="660" y="148" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">noise = |randn(N)| × scale</text>
  <text x="660" y="168" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">Scale chosen so that:</text>
  <text x="660" y="188" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#E74C3C">SNR = var(S) / var(S + E)</text>

  <!-- Arrows to Step 3 -->
  <line x1="240" y1="210" x2="240" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="210" x2="660" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="250" x2="450" y2="250" stroke="#555" stroke-width="2"/>
  <line x1="660" y1="250" x2="450" y2="250" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="250" x2="450" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- STEP 3: Build RSM -->
  <rect x="200" y="280" width="500" height="140" rx="10" fill="url(#rsmGrad)" opacity="0.9"/>
  <text x="450" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 3: Build RSM</text>

  <rect x="220" y="315" width="460" height="90" rx="5" fill="white" opacity="0.95"/>
  <text x="450" y="340" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">X_combined = [X, noise]  →  (N × k+1)</text>
  <text x="450" y="365" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#2C3E50">RSM = X_combined @ X_combined.T</text>
  <text x="450" y="390" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="#9B59B6">RSM = X@X.T + noise@noise.T = S + E</text>

  <!-- Arrow splitting to RSA and SRF -->
  <line x1="450" y1="420" x2="450" y2="460" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="460" x2="650" y2="460" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="460" x2="250" y2="490" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="460" x2="650" y2="490" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- STEP 4: RSA Test -->
  <rect x="50" y="500" width="380" height="200" rx="10" fill="url(#rsaGrad)" opacity="0.9"/>
  <text x="240" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 4: RSA (Mantel Test)</text>

  <rect x="70" y="535" width="340" height="150" rx="5" fill="white" opacity="0.95"/>
  <text x="240" y="558" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#2C3E50">H = X @ X.T  (hypothesis RSM)</text>
  <text x="240" y="580" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#2C3E50">obs = corr(offdiag(H), offdiag(RSM))</text>
  <text x="240" y="608" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7F8C8D">Null distribution:</text>
  <text x="240" y="628" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">for p in 1..n_perms:</text>
  <text x="240" y="646" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">  H_perm = permute rows/cols of H</text>
  <text x="240" y="664" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">  null[p] = corr(H_perm, RSM)</text>
  <text x="240" y="682" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#E67E22">p_rsa = (sum(null ≥ obs) + 1) / (n+1)</text>

  <!-- STEP 5: SRF Test -->
  <rect x="470" y="500" width="380" height="200" rx="10" fill="url(#srfGrad)" opacity="0.9"/>
  <text x="660" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 5: SRF (Matching LOO)</text>

  <rect x="490" y="535" width="340" height="150" rx="5" fill="white" opacity="0.95"/>
  <text x="660" y="555" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#2C3E50">W = SRF(rank=k).fit(RSM)</text>
  <text x="660" y="578" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7F8C8D">For each item i (LOO):</text>
  <text x="660" y="596" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">1. Hungarian match W[~i] → X[~i]</text>
  <text x="660" y="612" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">2. Apply permutation to W[i]</text>
  <text x="660" y="628" font-family="Monaco, monospace" font-size="10" text-anchor="middle" fill="#95A5A6">3. pred = argmax(W_aligned[i])</text>
  <text x="660" y="644" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#2C3E50">obs_acc = fraction correct</text>
  <text x="660" y="668" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">Null: permute X rows, recompute acc</text>
  <text x="660" y="682" font-family="Monaco, monospace" font-size="11" text-anchor="middle" fill="#27AE60">p_srf = (sum(null ≥ obs) + 1) / (n+1)</text>

  <!-- Arrows to Step 6 -->
  <line x1="240" y1="700" x2="240" y2="740" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="700" x2="660" y2="740" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- STEP 6: Power -->
  <rect x="150" y="750" width="600" height="100" rx="10" fill="#2C3E50" opacity="0.9"/>
  <text x="450" y="780" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">STEP 6: Compute Power</text>

  <rect x="170" y="795" width="260" height="40" rx="5" fill="#E67E22" opacity="0.3"/>
  <text x="300" y="820" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="white">power_rsa = % with p_rsa &lt; 0.05</text>

  <rect x="470" y="795" width="260" height="40" rx="5" fill="#27AE60" opacity="0.3"/>
  <text x="600" y="820" font-family="Monaco, monospace" font-size="12" text-anchor="middle" fill="white">power_srf = % with p_srf &lt; 0.05</text>

  <!-- Key insight box -->
  <rect x="100" y="880" width="700" height="130" rx="10" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2"/>
  <text x="450" y="910" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Key Insight</text>

  <text x="450" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">RSM = Signal + Noise = X@X.T + noise@noise.T</text>

  <rect x="130" y="955" width="300" height="40" rx="5" fill="#E67E22" opacity="0.15"/>
  <text x="280" y="980" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#D35400">RSA: corr(Signal, RSM) drops with noise</text>

  <rect x="470" y="955" width="300" height="40" rx="5" fill="#27AE60" opacity="0.15"/>
  <text x="620" y="980" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1E8449">SRF(k): filters noise dimension</text>

  <!-- SNR scale -->
  <text x="450" y="1040" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">SNR = 1.0 (no noise) → SNR = 0.1 (90% noise variance)</text>

  <!-- Legend -->
  <rect x="750" y="1060" width="15" height="15" fill="#4A90D9"/>
  <text x="770" y="1072" font-family="Arial, sans-serif" font-size="10" fill="#555">Signal</text>
  <rect x="810" y="1060" width="15" height="15" fill="#E74C3C"/>
  <text x="830" y="1072" font-family="Arial, sans-serif" font-size="10" fill="#555">Noise</text>
</svg>
