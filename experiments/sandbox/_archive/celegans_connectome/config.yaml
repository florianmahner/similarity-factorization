defaults:
  - /base
  - _self_

# C. elegans Connectome Factorization
data_file: "${project_root}/data/celegans/herm_full_edgelist.csv"

# SRF parameters
rank: 10

# Symmetrization strategy: "gap_only", "symmetrize", "max"
symmetry: "symmetrize"

# Edge type: "all", "chemical", "electrical"
edge_type: "all"

# Normalization: "none", "log", "max"
normalize: "log"
