# Local Development Config (Joblib Version)
# @package _global_
defaults:
  - /base  # Inherit from root configs/base.yaml
  - _self_

experiment_name: ppi_node_class
task: classification

# --- Experiment Params (Lists supported) ---
sizes: [500, 1000, 2000, 4000]
ranks: [25, 50, 100]
methods: [srf, deepwalk, node2vec, line]

line:
  epoch: 50
  order: 3
  batch_size: 256
  negative_ratio: 5
  table_size: 1000000

bins:
  small: [11, 30]
  medium: [31, 100]
  large: [101, 300]

plot_results: true
plot_input_dir: ./outputs/2025-11-26/16-14-30/

# Parallelism
n_jobs: -1
data_dir: ${paths.data_dir}/ppi

# --- No Sweeper Needed (Internal Loop) ---
# We force single run mode as run.py handles parallelism internally
hydra:
  mode: RUN
  run:
    # Outputs strictly in local 'outputs/' folder + timestamp.
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - file:///LOCAL/fmahner/similarity-factorization/configs
